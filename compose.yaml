services:
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trace-local
      MINIO_ROOT_PASSWORD: replace-before-deploying
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # WebShark provides sharkd/Wireshark analysis. It is intentionally separate
  # from the Bun API. The capture volume is always read-only.
  webshark:
    image: ghcr.io/qxip/webshark:latest
    ports:
      - "8085:8085"
    volumes:
      - ./CASE_05_SILENT_BEACON/artifacts:/captures:ro

volumes:
  minio-data:
  redis-data:
