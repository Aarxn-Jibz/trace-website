services:
  # WebShark provides sharkd/Wireshark analysis. It is intentionally separate
  # from the Bun API. The capture volume is always read-only.
  webshark:
    image: ghcr.io/qxip/webshark:latest
    ports:
      - "8085:8085"
    volumes:
      - ./CASE_05_SILENT_BEACON/artifacts:/captures:ro
