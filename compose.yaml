services:
  # WebShark provides sharkd/Wireshark analysis. It is intentionally separate
  # from the Bun API. The capture volume is always read-only.
  webshark:
    image: ghcr.io/qxip/webshark:latest
    ports:
      - "8085:8085"
    volumes:
      # Mount captures individually as read-only. WebShark must still be able to
      # create its transient sharkd Unix socket in /captures.
      - ./CASE_05_SILENT_BEACON/artifacts/dns_tunnel.pcap:/captures/dns_tunnel.pcap:ro
