services:
  # WebShark provides sharkd/Wireshark analysis. It is intentionally separate
  # from the Bun API. The capture volume is always read-only.
  webshark:
    image: ghcr.io/qxip/webshark:latest
    ports:
      - "8085:8085"
    environment:
      # Keep sharkd's ephemeral socket outside the read-only evidence mount.
      SHARKD_SOCKET: /tmp/sharkd.sock
    volumes:
      - ./CASE_02_Medium/artifacts:/captures:ro
